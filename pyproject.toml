[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dementia-dte"
version = "0.1.0"
description = "Reference architecture and runnable reference implementation for a Digital Twin Engine and Memory Anchoring Pipeline in dementia care."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Kishan Das" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
]
keywords = ["digital-twin", "brain-computer-interface", "dementia", "eeg", "fhir", "health-ai"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3", "httpx>=0.27"]

[project.scripts]
dte = "dte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # UP045/UP007 would rewrite Optional[X] as X | None. The modules use
  # `from __future__ import annotations`, so that is valid for plain annotations on Python 3.9 —
  # but pydantic (used by dte.api) evaluates annotations at RUNTIME, where PEP 604 unions are a
  # syntax error before 3.10. Since ADR-0004's portability goal means supporting older
  # interpreters on modest hospital infrastructure, Optional stays.
  "UP045",
  "UP007",
]
